<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynaptaHub — Web Administrator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/admin/static/syn_icon_app.jpg">

    <!-- React + Babel + Tailwind ผ่าน CDN — ไม่มีขั้นตอน build ให้ดูแล รันบน RPi ได้ตรง ๆ -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ธีม Deep Glass — สีชุดเดียวกับฝั่งแอป (theme.dart)
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg0: '#080B12', bg1: '#10141F', panel: '#141925', card: '#1A2030', cardhi: '#20283A',
              line: '#2A3142', lineStrong: '#3A4256',
              ink: '#EEF1F5', inkDim: '#A6AEBC', inkXdim: '#6B7385',
              accent: '#00D4FF', accent2: '#B44FFF', ok: '#34D399', danger: '#EF4444',
            },
            fontFamily: {
              sans: ['Noto Sans Thai', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['Roboto Mono', 'monospace'],
            },
            borderRadius: { xl2: '18px' },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/admin/static/style.css">
</head>
<body class="bg-bg0 text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel" data-presets="react" src="/admin/static/app.js"></script>
</body>
</html>
